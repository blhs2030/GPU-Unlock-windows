<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">gpu-unlock for Windows — screenshot placeholder</title>
  <desc id="desc">A placeholder image showing a mock console session of gpu_unlock.exe list.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="url(#bg)"/>

  <!-- dashed placeholder frame -->
  <rect x="24" y="24" width="1152" height="432" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- badge -->
  <g class="sans">
    <rect x="52" y="48" width="196" height="30" rx="15" fill="#e0e7ff"/>
    <text x="150" y="68" text-anchor="middle" font-size="14" fill="#3730a3" font-weight="600">SCREENSHOT PLACEHOLDER</text>
  </g>

  <!-- terminal window -->
  <rect x="52" y="96" width="1096" height="300" rx="10" fill="#0f172a"/>
  <rect x="52" y="96" width="1096" height="38" rx="10" fill="#1e293b"/>
  <rect x="52" y="124" width="1096" height="10" fill="#1e293b"/>
  <circle cx="76" cy="115" r="6" fill="#ef4444"/>
  <circle cx="96" cy="115" r="6" fill="#f59e0b"/>
  <circle cx="116" cy="115" r="6" fill="#22c55e"/>
  <text x="600" y="120" text-anchor="middle" class="mono" font-size="13" fill="#94a3b8">Command Prompt — gpu_unlock.exe</text>

  <g class="mono" font-size="15">
    <text x="76" y="168" fill="#93c5fd">PS C:\gpu-unlock&gt;</text>
    <text x="300" y="168" fill="#e2e8f0">.\gpu_unlock.exe list</text>

    <text x="76" y="200" fill="#cbd5e1">Real NVIDIA PCI devices reported by SetupAPI: 1</text>
    <text x="76" y="226" fill="#e2e8f0">  0000:01:00.0 10de:2484  <tspan fill="#4ade80">supported</tspan>  NVIDIA GeForce RTX 3070</text>
    <text x="76" y="252" fill="#94a3b8">                bound service: nvlddmkm</text>
    <text x="76" y="284" fill="#94a3b8">Simulated target: 0000:21:00.0 10de:2484 RTX 3070 (GA104) - in-process register model, not real hardware</text>

    <text x="76" y="328" fill="#93c5fd">PS C:\gpu-unlock&gt;</text>
    <text x="300" y="328" fill="#e2e8f0">.\gpu_unlock.exe real --probe</text>
    <text x="76" y="358" fill="#cbd5e1">config space: vendor=10de device=2484 command=0407</text>
    <text x="76" y="382" fill="#fbbf24">state: WPR2 is down (card has not been initialised since power on)</text>
  </g>

  <!-- footer note -->
  <text x="600" y="432" text-anchor="middle" class="sans" font-size="13" fill="#64748b">
    Replace this file with docs/screenshot.png (1200 × 480 recommended) before publishing.
  </text>
</svg>
